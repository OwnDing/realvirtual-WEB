<html lang="zh-CN" data-rv-default-locale="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" data-rv-csp content="default-src 'self'; base-uri 'self'; object-src 'none'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'self'; form-action 'self'" />
  <meta name="theme-color" content="#2596DE" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" data-rv-favicon />
  <link rel="icon" type="image/png" href="/favicon.png" data-rv-favicon />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" data-rv-favicon />
  <link rel="manifest" href="/manifest.json" />
  <title>XYvirtual WEB — Browser-based 3D HMI & Digital Twin Viewer</title>
  <meta name="description" data-rv-description content="XYvirtual WEB is the open, browser-based 3D HMI and digital twin viewer for industrial automation. Explore live demos of conveyor simulation, robotics and PLC-connected 3D visualization — no installation, right in the browser." />
  <!-- URL-bound SEO tags (canonical, og:url, og:image, twitter:card) are injected
       per deploy by scripts/bunny-deploy.mjs — the committed file stays deployment-neutral. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" data-rv-site-name content="XYvirtual WEB" />
  <meta property="og:title" data-rv-title content="XYvirtual WEB — Browser-based 3D HMI & Digital Twin Viewer" />
  <meta property="og:description" data-rv-description content="Open, browser-based 3D HMI and digital twin viewer for industrial automation. Live demos: conveyor simulation, robotics, PLC-connected 3D visualization." />
  <script type="application/ld+json" data-rv-json-ld>
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "XYvirtual WEB",
    "alternateName": "XYvirtual WebViewer",
    "description": "Open, browser-based 3D HMI and digital twin viewer for industrial automation: conveyor simulation, robotics, sensors and live PLC signals rendered in real time in the browser.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Any (web browser)",
    "browserRequirements": "Requires JavaScript and WebGL2",
    "license": "https://www.gnu.org/licenses/agpl-3.0.html",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "publisher": { "@type": "Organization", "name": "realvirtual GmbH", "url": "https://xyvirtual.io" },
    "sameAs": ["https://github.com/xyvirtual/XYvirtual-WEB"]
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100dvh; height: 100vh; overflow: hidden; background: #9a9a9a; }

    /* --- Global scrollbar styling ---
       Transparent track (no white background); the thumb is invisible by default
       and only fades in while the scrollable container is hovered. Applied
       app-wide so every UI window matches — including native scrollbars that
       don't use the .rv-scroll helper class. */
    * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
    *:hover { scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: transparent; border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
    *:hover::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); }
    *:hover::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.38); }
    ::-webkit-scrollbar-button { display: none !important; }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* Scale up react-root overlay on touch devices so buttons/text are physically large enough.
       The 3D canvas is unaffected. On phones the viewport is ~360-430px CSS-wide but
       devicePixelRatio is 2-3x, making CSS-px physically tiny. */
    @media (hover: none) and (pointer: coarse) {
      #react-root { zoom: 1; }
    }
    #app { width: 100%; height: 100dvh; height: 100vh; touch-action: none; }
    #react-root { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }

    /* Signal / node-link drag in progress. The body class was set but had NO
       rule anywhere in the repo, so it promised something it never did. It now
       does exactly one thing: stop the pointer from selecting label text while
       it is dragged across panels. It deliberately does NOT dim non-candidate
       rows — compatible rows announce themselves, the rest stays calm
       (Entscheidungs-Log 29.07.). */
    body.rv-signal-dragging, body.rv-node-link-dragging {
      user-select: none;
      -webkit-user-select: none;
    }

    /* --- Loading Overlay --- */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }
    #loading-overlay.hidden {
      display: none;
    }
    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo-wrap {
      position: relative;
      width: min(120px, 30vw);
      height: min(120px, 30vw);
    }

    .loader-logo {
      width: min(120px, 30vw);
      height: min(120px, 30vw);
      animation: logo-pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(45, 212, 191, 0.6));
    }

    /* Orbiting dot */
    .orbit-ring {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 1px solid rgba(45, 212, 191, 0.14);
    }
    .orbit-dot {
      position: absolute;
      inset: -30px;
      animation: orbit-spin 2s linear infinite;
    }
    .orbit-dot::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #2DD4BF;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(45, 212, 191, 0.85), -6px 0 5px rgba(79, 70, 229, 0.35);
    }

    /* Brand name — prominent */
    .loader-brand {
      margin-top: 48px;
      color: #ccc;
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1.5px;
    }

    /* Slogan — below brand */
    .loader-slogan {
      margin-top: 6px;
      color: #888;
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* GitHub link — below slogan */
    .loader-github {
      margin-top: 8px;
      color: #666;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    .loader-github:hover {
      color: #2DD4BF;
    }

    /* Status line — subtle */
    .loader-status {
      margin-top: 10px;
      color: #666;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .loader-status .model-name {
      color: #999;
      font-family: 'Consolas', 'Monaco', monospace;
    }

    /* Progress bar */
    .loader-progress-wrap {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .loader-progress-track {
      width: min(220px, 60vw);
      height: 4px;
      background: #2a2a2a;
      border-radius: 3px;
      overflow: hidden;
    }
    .loader-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2DD4BF, #4F46E5);
      border-radius: 3px;
      transition: width 0.3s ease-out;
    }
    /* Indeterminate sweep when no real progress */
    .loader-progress-bar.indeterminate {
      width: 30%;
      animation: progress-sweep 1.8s ease-in-out infinite;
    }
    .loader-progress-pct {
      color: #555;
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      min-height: 14px;
    }
    /* Secondary line: what is happening + how long it should still take.
       Reserved height so the overlay never reflows as the text changes. */
    .loader-detail {
      color: #777;
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3px;
      margin-top: 4px;
      min-height: 14px;
      text-align: center;
    }
    .loader-detail.warn { color: #b8860b; }

    /* --- Error state --- */
    .loader-error {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: min(380px, 86vw);
      text-align: center;
    }
    .loader-error.hidden { display: none; }
    .loader-error-title {
      color: #ff6b6b;
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .loader-error-detail {
      margin-top: 8px;
      color: #888;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }
    .loader-error-actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .loader-btn {
      appearance: none;
      border: 1px solid #444;
      background: transparent;
      color: #ccc;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.4px;
      padding: 9px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .loader-btn:hover { border-color: #666; color: #fff; }
    .loader-btn-primary {
      border-color: #2DD4BF;
      background: linear-gradient(90deg, #2DD4BF, #4F46E5);
      color: #fff;
    }
    .loader-btn-primary:hover { filter: brightness(1.08); color: #fff; }

    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(45, 212, 191, 0.5)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 28px rgba(79, 70, 229, 0.8)); }
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes progress-sweep {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <noscript>
    <div style="max-width: 640px; margin: 10vh auto 0; padding: 0 24px; color: #222; font-family: 'Segoe UI', sans-serif; line-height: 1.6;">
      <h2><span data-rv-product-name>XYvirtual WEB</span> — Browser-based 3D HMI &amp; Digital Twin Viewer</h2>
      <p><span data-rv-product-name>XYvirtual WEB</span> loads industrial 3D models (GLB) and runs interactive simulation of
         conveyors, drives, sensors and robots directly in the browser — as a 3D HMI connected
         to live PLC signals or as a standalone digital twin demo. JavaScript and WebGL are
         required to run the viewer.</p>
      <p>JavaScript is disabled. Ask the deployment administrator for documentation and corresponding-source links.</p>
    </div>
  </noscript>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loader-logo-wrap">
      <div class="orbit-ring"></div>
      <div class="orbit-dot"></div>
      <!-- Decorative: the <h1> right below already announces the brand, so a
           named logo would make a screen reader say "XYvirtual" twice. -->
      <img class="loader-logo" src="/logo.png" alt="" data-rv-logo />
    </div>
    <h1 class="loader-brand" data-rv-product-name>XYvirtual WEB</h1>
    <div class="loader-slogan">开放、轻量、工业级、随处可用。</div>
    <div class="loader-status" id="loading-status"><span id="loading-label">正在加载 </span><span class="model-name" id="loading-model-name"></span></div>
    <div class="loader-progress-wrap">
      <div class="loader-progress-track"><div class="loader-progress-bar indeterminate" id="loading-progress-bar"></div></div>
      <div class="loader-progress-pct" id="loading-progress-pct"></div>
      <div class="loader-detail" id="loading-detail"></div>
    </div>
    <!-- Error state (hidden until a load fails after all retries) -->
    <div class="loader-error hidden" id="loading-error">
      <div class="loader-error-title">无法加载模型</div>
      <div class="loader-error-detail" id="loading-error-detail"></div>
      <div class="loader-error-actions">
        <button type="button" class="loader-btn loader-btn-primary" id="loading-retry-btn">重试</button>
        <button type="button" class="loader-btn" id="loading-reload-btn">重新加载页面</button>
      </div>
    </div>
  </div>


  <!--
    Pre-boot language (ADR-0001 §11).

    The overlay above is Chinese because `zh-CN` IS the product default: the
    common case needs no script at all and its very first paint is already
    right. This block only runs for someone who chose English.

    It has to be an inline, classic script. `/src/main.ts` is a module, and a
    module is deferred by definition — it cannot run until parsing is done, by
    which time the overlay has been on screen for however long the 3 MB entry
    chunk took to arrive. That gap is exactly the "flash of the wrong language"
    the ADR rules out, and no amount of rewriting inside main.ts closes it.

    The five strings and the storage contract are duplicated from the catalog
    on purpose — a script that imports cannot run this early. The duplication is
    CHECKED rather than trusted: see tests/i18n-preboot.node.test.ts.
  -->
  <script>
    (function () {
      var useEnglish = document.documentElement.getAttribute('data-rv-default-locale') === 'en-US';
      try {
        var raw = localStorage.getItem('rv-language');
        if (raw) {
          var rec = JSON.parse(raw);
          if (rec && rec.v !== 1) rec = null;
          if (rec && typeof rec.locale === 'string') {
            useEnglish = rec.locale.trim().toLowerCase().split(/[-_]/)[0] === 'en';
          }
        }
      } catch (err) {
        // Storage refused or contains junk — keep the deployment default.
      }
      if (!useEnglish) return;
      document.documentElement.lang = 'en-US';
      var set = function (selector, text) {
        var el = document.querySelector(selector);
        if (el) el.textContent = text;
      };
      set('.loader-slogan', 'Open. Light. Industrial. Anywhere.');
      set('#loading-label', 'Loading ');
      set('.loader-error-title', 'Could not load the model');
      set('#loading-retry-btn', 'Retry');
      set('#loading-reload-btn', 'Reload page');
    })();
  </script>

  <div id="react-root"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
