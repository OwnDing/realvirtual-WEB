name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/verify.sh governance

  static:
    name: Static Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh static

  node:
    name: Node Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The i18n verbatim gate reads the fixed pre-migration commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh node

  browser:
    name: Browser Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build browser test artifacts
        env:
          RV_DEPLOYMENT_PROFILE: offline
        run: ./scripts/verify.sh build
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium
        timeout-minutes: 10
      - name: Run browser tests
        env:
          RV_BROWSER_DIAGNOSTIC_INTERVAL_SECONDS: '15'
        run: ./scripts/verify.sh browser
        timeout-minutes: 20
      - name: Verify offline production journeys in an isolated network
        run: node scripts/run-offline-gate.mjs
        timeout-minutes: 10
      - name: Upload offline gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-gate-evidence
          path: test-results/offline/
          if-no-files-found: ignore

  build:
    name: Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh build
