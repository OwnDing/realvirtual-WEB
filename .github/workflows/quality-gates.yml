name: Quality Gates

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    if: github.event_name != 'schedule'
    name: Governance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: ./scripts/verify.sh governance

  static:
    if: github.event_name != 'schedule'
    name: Static Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh static

  node:
    if: github.event_name != 'schedule'
    name: Node Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The i18n verbatim gate reads the fixed pre-migration commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      - run: ./scripts/verify.sh node

  browser:
    name: Browser Gate
    needs: compatibility-windows
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require Windows compatibility success
        env:
          COMPATIBILITY_WINDOWS_RESULT: ${{ needs.compatibility-windows.result }}
        run: test "$COMPATIBILITY_WINDOWS_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build browser test artifacts
        env:
          RV_DEPLOYMENT_PROFILE: offline
        run: ./scripts/verify.sh build
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium
        timeout-minutes: 10
      - name: Verify offline user help and customer workflows
        run: npm run verify:help
        timeout-minutes: 5
      - name: Upload user help evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: user-help-evidence
          path: test-results/user-help/verification/
          if-no-files-found: error
      - name: Verify compatibility production workflows
        run: npm run verify:compatibility
        timeout-minutes: 5
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-evidence
          path: test-results/compatibility/
          if-no-files-found: ignore
      - name: Verify offline production journeys in an isolated network
        run: node scripts/run-offline-gate.mjs
        timeout-minutes: 10
      - name: Verify protected presentations through real HTTPS
        run: |
          docker pull caddy:2.11.4-alpine
          node scripts/test-protected-presentations.mjs
        timeout-minutes: 10
      - name: Verify single-file demos in offline Chromium
        run: |
          node scripts/test-demo-package.mjs
          node scripts/test-demo-package-authoring.mjs
        timeout-minutes: 5
      - name: Verify script boundaries with a process watchdog
        run: node scripts/security/test-script-boundaries.mjs
        timeout-minutes: 3
      - name: Verify script consent in the production workbench
        run: node scripts/security/test-script-production.mjs
        timeout-minutes: 3
      - name: Upload script security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: script-security-evidence
          path: test-results/security/script-*
          if-no-files-found: error
      - name: Run browser tests
        env:
          RV_BROWSER_DIAGNOSTIC_INTERVAL_SECONDS: '15'
        run: ./scripts/verify.sh browser
        timeout-minutes: 20
      - name: Verify white-label production journeys
        run: node scripts/test-white-label.mjs
        timeout-minutes: 5
      - name: Verify progressive loading in production Chromium
        run: npm run verify:performance
        timeout-minutes: 5
      - name: Upload loading performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loading-performance-evidence
          path: test-results/loading-performance/
          if-no-files-found: ignore
      - name: Upload offline gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-gate-evidence
          path: test-results/offline/
          if-no-files-found: ignore
      - name: Upload protected presentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-presentation-evidence
          path: test-results/access/
          if-no-files-found: ignore

      - name: Upload demo package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-package-evidence
          path: test-results/demo-package/
          if-no-files-found: ignore

      - name: Upload white-label evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: white-label-evidence
          path: test-results/white-label/
          if-no-files-found: ignore

  compatibility-windows:
    if: github.event_name != 'schedule'
    name: Windows browser compatibility
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build public production artifacts
        run: npm run build
        env:
          RV_DEPLOYMENT_PROFILE: offline
      - name: Verify real Chrome and Edge channels
        shell: bash
        run: |
          node scripts/verify-compatibility-production.mjs --channel=chrome
          node scripts/verify-compatibility-production.mjs --channel=msedge
      - name: Upload Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-windows-evidence
          path: test-results/compatibility/
          if-no-files-found: ignore

  build:
    if: github.event_name != 'schedule'
    name: Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh build

  e2e:
    # EP-E2E-001: the full Playwright suite — no retries, no continue-on-error,
    # no subset. Specs that need the private sibling are excluded by the
    # generated list in e2e/private-dependent-specs.json only when that sibling
    # is absent (playwright.config.ts).
    #
    # Runs on a SELF-HOSTED runner with a GPU (user decision 2026-11-03): on
    # GitHub's GPU-less hosted runners WebGL is software-rendered and the 3D
    # pages starve (run 41638500304: 35-minute step timeout, clicks hanging in
    # "scrolling into view", a 30 fps perf check that cannot pass there).
    # The job is skipped until the repository variable E2E_GPU_RUNNER is
    # 'true', and it NEVER runs a pull request from a fork: this repository is
    # public, and a fork PR on a self-hosted runner would execute arbitrary
    # code on the maintainer's machine.
    if: >-
      github.event_name != 'schedule' && vars.E2E_GPU_RUNNER == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: E2E Gate
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
      # No `cache: npm` here: on a self-hosted runner ~/.npm already persists on
      # the machine, and the GitHub copy of it is 1.36 GiB — run 41789510169
      # spent 33 of its 42 minutes uploading it (0.7 MB/s), most of the job's
      # 60-minute budget, and every later run would download it again.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium
        timeout-minutes: 10
      - name: Run end-to-end suite
        run: ./scripts/verify.sh e2e
        timeout-minutes: 35
      - name: Guard the formal rv-embed artifact the suite just built (KD-003)
        env:
          RV_REQUIRE_EMBED_DIST: '1'
        run: node node_modules/vitest/vitest.mjs run --config vitest.node.config.ts tests/embed-spike.node.test.ts
        timeout-minutes: 3
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: test-results/
          if-no-files-found: ignore

  supply-chain:
    name: Supply Chain Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Verify scanner runtime
        run: test "$(npm --version)" = 10.9.7
      - name: Install public locked packages without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      - name: Evaluate vulnerabilities, licenses and completeness
        run: ./scripts/verify.sh supply-chain
      - name: Upload security evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence
          path: |
            test-results/security/*.json
            test-results/security/*.md
            test-results/security/*.txt
            test-results/security/gateway/*.json
            test-results/security/gateway/*.md
            test-results/security/gateway/*.txt
          if-no-files-found: error
          retention-days: 30
