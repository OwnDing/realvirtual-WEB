name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/verify.sh governance

  static:
    name: Static Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh static

  node:
    name: Node Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The i18n verbatim gate reads the fixed pre-migration commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh node

  browser:
    name: Browser Gate
    needs: compatibility-windows
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require Windows compatibility success
        env:
          COMPATIBILITY_WINDOWS_RESULT: ${{ needs.compatibility-windows.result }}
        run: test "$COMPATIBILITY_WINDOWS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build browser test artifacts
        env:
          RV_DEPLOYMENT_PROFILE: offline
        run: ./scripts/verify.sh build
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium
        timeout-minutes: 10
      - name: Verify compatibility production workflows
        run: npm run verify:compatibility
        timeout-minutes: 5
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: test-results/compatibility/
          if-no-files-found: ignore
      - name: Verify offline production journeys in an isolated network
        run: node scripts/run-offline-gate.mjs
        timeout-minutes: 10
      - name: Verify protected presentations through real HTTPS
        run: |
          docker pull caddy:2.11.4-alpine
          node scripts/test-protected-presentations.mjs
        timeout-minutes: 10
      - name: Verify single-file demos in offline Chromium
        run: |
          node scripts/test-demo-package.mjs
          node scripts/test-demo-package-authoring.mjs
        timeout-minutes: 5
      - name: Run browser tests
        env:
          RV_BROWSER_DIAGNOSTIC_INTERVAL_SECONDS: '15'
        run: ./scripts/verify.sh browser
        timeout-minutes: 20
      - name: Verify white-label production journeys
        run: node scripts/test-white-label.mjs
        timeout-minutes: 5
      - name: Verify progressive loading in production Chromium
        run: npm run verify:performance
        timeout-minutes: 5
      - name: Upload loading performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loading-performance-evidence
          path: test-results/loading-performance/
          if-no-files-found: ignore
      - name: Upload offline gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-gate-evidence
          path: test-results/offline/
          if-no-files-found: ignore
      - name: Upload protected presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-presentation-evidence
          path: test-results/access/
          if-no-files-found: ignore

      - name: Upload demo package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-package-evidence
          path: test-results/demo-package/
          if-no-files-found: ignore

      - name: Upload white-label evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: white-label-evidence
          path: test-results/white-label/
          if-no-files-found: ignore

  compatibility-windows:
    name: Windows browser compatibility
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build public production artifacts
        run: npm run build
        env:
          RV_DEPLOYMENT_PROFILE: offline
      - name: Verify real Chrome and Edge channels
        shell: bash
        run: |
          node scripts/verify-compatibility-production.mjs --channel=chrome
          node scripts/verify-compatibility-production.mjs --channel=msedge
      - name: Upload Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-windows-evidence
          path: test-results/compatibility/
          if-no-files-found: ignore

  build:
    name: Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh build
